name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    name: Build e verificações
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build
        run: python3 frontend/build.py
      - name: Verificações de conteúdo, links e SEO
        env:
          # Variável do repositório (Settings > Secrets and variables > Actions > Variables).
          FORBIDDEN_TERMS: ${{ vars.FORBIDDEN_TERMS }}
        run: python3 frontend/check.py

  # Scanners de segurança em runner do GitHub (seguro para PRs de forks: token somente leitura).
  # Imagens fixadas por versão. Qualquer achado reprova o PR.
  security:
    name: Segurança
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks (segredos no histórico)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo:ro" \
            zricethezav/gitleaks:v8.30.1 detect --source=/repo --redact --verbose
      - name: Trivy (vulnerabilidades, configuração e segredos)
        run: |
          docker run --rm -v "$PWD:/src:ro" aquasec/trivy:0.76.2 \
            fs --scanners vuln,misconfig,secret --severity HIGH,CRITICAL --exit-code 1 /src
      - name: Semgrep (análise estática)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/src:ro" semgrep/semgrep:1.184.0 \
            semgrep scan --config auto --metrics=off --error /src
