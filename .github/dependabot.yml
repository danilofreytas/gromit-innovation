version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Espera 7 dias antes de propor versões recém-publicadas (mitiga pacotes comprometidos).
    cooldown:
      default-days: 7
  - package-ecosystem: terraform
    directory: /infra
    schedule:
      interval: weekly
    # Espera 7 dias antes de propor versões recém-publicadas (mitiga pacotes comprometidos).
    cooldown:
      default-days: 7
